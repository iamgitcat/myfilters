# ✂️ --- START: compile_and_push ---
      - name: Compile Manual Rule-sets 🛠
        run: |
          echo "📁 Current directory contents:"
          ls -la

          # Проверяем наличие хотя бы одного исходника
          if [ ! -f "manualtxt.txt" ] && [ ! -f "manual.json" ]; then
            echo "❌ Error: Neither manualtxt.txt nor manual.json found in repository root!"
            exit 1
          fi

          # 1. Из обычного списка доменов manualtxt.txt собираем manualtxt.json и manualtxt.srs
          if [ -f manualtxt.txt ]; then
            echo "⚙️ Compiling manualtxt.txt..."
            echo '{"version": 1, "rules": [{"domain": [' > manualtxt.json
            sed 's/^/"/;s/$/",/' manualtxt.txt | sed '$ s/,$//' >> manualtxt.json
            echo ']}]}' >> manualtxt.json
            ./sing-box rule-set compile --output manualtxt.srs manualtxt.json
          fi

          # 2. Из готового manual.json компилируем manual.srs
          if [ -f manual.json ]; then
            echo "⚙️ Compiling manual.json..."
            ./sing-box rule-set compile --output manual.srs manual.json
          fi

      - name: Push results 🚀
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add manualtxt.json manualtxt.srs manual.srs 2>/dev/null || true
          git status
          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected to commit."
          else
            git commit -m "Update manual rule-sets: $(date)"
            git push
          fi
# 🛑 --- END: compile_and_push ---
