# ✂️ --- START: manual_steps ---
      - name: Compile Manual SRS 🚀
        run: |
          # Собираем минимальный валидный JSON v1 на лету без сохранения мусора
          echo '{"version": 1, "rules": [{"domain": [' > manual.json
          sed 's/^/"/;s/$/",/' manual.txt | sed '$ s/,$//' >> manual.json
          echo ']}]}' >> manual.json
          
          ./sing-box rule-set compile --output manual.srs manual.json
          rm -f manual.json

      - name: Push results 📦
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add manual.srs
          git diff --staged --quiet || git commit -m "Update manual SRS: $(date)"
          git push
# 🛑 --- END: manual_steps ---
